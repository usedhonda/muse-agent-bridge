name: AI security review

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  ai-review:
    uses: usedhonda/security-review/.github/workflows/ai-review-reusable.yml@a1c056843312ad9e61da3c5b6069130d4193e3b1
    with:
      max_cost_usd: '0.50'
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
