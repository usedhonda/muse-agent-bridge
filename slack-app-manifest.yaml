# Owner-only deployment profile, matching the existing secretary app settings.
# User scopes permit read-only observation; the bridge uses only the bot token.
# Keep installations, tokens and real IDs out of this file.
display_information:
  name: Muse
  description: Personal agent Muse. Owner-only DM and read-only observation.
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Muse
    always_online: false
  agent_view:
    agent_description: Personal agent Muse. Conversations are limited to the owner
      and the approved private channel; other workspace messages are read-only observations.
    suggested_prompts: []
oauth_config:
  scopes:
    user:
    - channels:history
    - channels:read
    - groups:history
    - groups:read
    - im:history
    - im:read
    - mpim:history
    - mpim:read
    - users:read
    - search:read
    bot:
    - chat:write
    - im:history
    - im:read
    - im:write
    - groups:read
    - groups:history
    - assistant:write
  pkce_enabled: false
settings:
  event_subscriptions:
    bot_events:
    - message.im
    - message.groups
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  is_mcp_enabled: false
  token_rotation_enabled: false
  app_level_token_rotation_enabled: false
