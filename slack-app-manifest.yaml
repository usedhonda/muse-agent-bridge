# Owner-only deployment profile, matching the existing secretary app settings.
# The bridge uses only the bot token. Do not grant unused user read scopes.
# Keep installations, tokens and real IDs out of this file.
display_information:
  name: Muse
  description: Personal Muse bot for owner DMs and approved private rooms.
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Muse
    always_online: false
  agent_view:
    agent_description: Personal Muse bot. Conversations are limited to the owner
      and explicitly configured private rooms. No general workspace observation.
    suggested_prompts: []
oauth_config:
  scopes:
    bot:
    - chat:write
    - im:history
    - im:read
    - im:write
    - groups:read
    - groups:history
    - assistant:write
  pkce_enabled: false
settings:
  event_subscriptions:
    bot_events:
    - message.im
    - message.groups
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  is_mcp_enabled: false
  token_rotation_enabled: false
  app_level_token_rotation_enabled: false
